<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2500" viewBox="0 0 1600 2500">
  <!-- 실제 127.0.0.1:5500 상세 라우트를 바탕으로 만든 Lunacy 편집용 4개 상세 페이지 -->
  <defs><style>.bg{fill:#f7f4d5}.dark{fill:#0a3323}.moss{fill:#839958}.rose{fill:#d3968c}.teal{fill:#105666}.ink{fill:#183b2b}.muted{fill:#637652}.label{font:600 16px Arial,sans-serif;letter-spacing:2px}.h1{font:700 56px Arial,sans-serif;letter-spacing:-2px}.h2{font:700 30px Arial,sans-serif}.body{font:400 20px Arial,sans-serif}.small{font:400 16px Arial,sans-serif}.white{fill:#f7f4d5}</style></defs>
  <rect width="1600" height="2500" fill="#eeeddb"/>
  <!-- COZY 상세 -->
  <g id="detail-cozy" transform="translate(50 50)"><rect width="720" height="1120" rx="28" class="bg"/><text x="38" y="48" class="label moss">FINAL · AI FASHION SERVICE</text><text x="38" y="125" class="h1 dark">COZY</text><text x="38" y="175" class="body muted">신체치수 추정부터 공유 옷장과 추천까지 연결</text><line x1="38" y1="215" x2="682" y2="215" stroke="#839958"/><text x="38" y="265" class="label teal">01 / 해결할 문제</text><text x="38" y="310" class="body ink">측정 정의가 다르면 모델 수치가</text><text x="38" y="340" class="body ink">추천에 사용할 수 없었습니다.</text><rect x="38" y="390" width="644" height="90" rx="18" class="dark"/><text x="65" y="430" class="label white">02 / 구현 흐름</text><text x="65" y="462" class="small white">입력·사진 → Django API → Tabular/VLM → 저장 → 모바일</text><text x="38" y="535" class="label teal">03 / 선택의 이유</text><text x="38" y="585" class="h2 dark">측정 정의를 먼저 교정</text><text x="38" y="625" class="small muted">동일 4,485행 기준으로 재계산 후 재학습</text><text x="38" y="695" class="h2 dark">부위별 사진 효과를 비교</text><text x="38" y="735" class="small muted">143명 비교 · 가슴·허리 개선, 5개 부위 악화</text><text x="38" y="805" class="label teal">04 / 결과와 검증</text><rect x="38" y="845" width="300" height="150" rx="18" fill="#e3e7c9"/><text x="65" y="905" class="h2 dark">11.613</text><text x="65" y="940" class="small muted">기존 정의 MAE cm</text><rect x="382" y="845" width="300" height="150" rx="18" class="moss"/><text x="409" y="905" class="h2 dark">1.537</text><text x="409" y="940" class="small ink">교정 후 MAE cm</text><text x="38" y="1045" class="label rose">05 / 한계·다음 개선</text><text x="38" y="1080" class="small muted">직접 입력 우선순위와 추천 ranking 지표를 추가 검증</text></g>
  <!-- 옆집손주 상세 -->
  <g id="detail-agent" transform="translate(830 50)"><rect width="720" height="1120" rx="28" class="dark"/><text x="38" y="48" class="label" fill="#c4d39e">04 · AGENT &amp; EVALUATION</text><text x="38" y="125" class="h1 white">옆집손주</text><text x="38" y="175" class="body white">복지·법령 상담 Agent의 실행과 평가</text><line x1="38" y1="215" x2="682" y2="215" stroke="#839958"/><text x="38" y="265" class="label" fill="#d3968c">01 / 해결할 문제</text><text x="38" y="310" class="body white">자연스러운 답변만으로는</text><text x="38" y="340" class="body white">근거와 실패 원인을 알기 어려웠습니다.</text><rect x="38" y="390" width="644" height="90" rx="18" fill="#214533"/><text x="65" y="430" class="label white">02 / 구현 흐름</text><text x="65" y="462" class="small white">질문 → FastAPI/LangGraph → RAG/MCP → LLM·SSE</text><text x="38" y="535" class="label" fill="#d3968c">03 / 선택의 이유</text><text x="38" y="585" class="h2 white">정확도·지연·비용을 분리 비교</text><text x="38" y="625" class="small" fill="#c4d39e">no-tool · 360문항 · LLM judge</text><text x="38" y="695" class="h2 white">오답을 8유형으로 분류</text><text x="38" y="735" class="small" fill="#c4d39e">405건 분석 · 데이터 누락/근거 매핑 우선</text><text x="38" y="805" class="label" fill="#d3968c">04 / 결과와 검증</text><text x="38" y="875" class="h1 white">28/28</text><text x="38" y="915" class="small" fill="#c4d39e">MCP 계약 테스트 · 단일 실행</text><text x="38" y="985" class="label" fill="#d3968c">05 / 한계·다음 개선</text><text x="38" y="1030" class="small" fill="#c4d39e">111건은 재평가 후보 · human gold와 p95 추가</text></g>
  <!-- CEO 상세 -->
  <g id="detail-ceo" transform="translate(50 1250)"><rect width="720" height="1120" rx="28" class="bg"/><text x="38" y="48" class="label moss">02 · CHURN PREDICTION</text><text x="38" y="125" class="h1 dark">CEO</text><text x="38" y="175" class="body muted">고객 이탈 예측과 임계값 판단</text><line x1="38" y1="215" x2="682" y2="215" stroke="#839958"/><text x="38" y="265" class="label teal">01 / 해결할 문제</text><text x="38" y="310" class="body ink">불균형 데이터에서 accuracy만 보면</text><text x="38" y="340" class="body ink">놓친 이탈 고객이 가려졌습니다.</text><rect x="38" y="390" width="644" height="90" rx="18" class="dark"/><text x="65" y="430" class="label white">02 / 구현 흐름</text><text x="65" y="462" class="small white">EDA → 전처리 → XGBoost/LightGBM → threshold → 혼동행렬</text><text x="38" y="535" class="label teal">03 / 선택의 이유</text><text x="38" y="585" class="h2 dark">놓침과 오탐 비용을 함께 확인</text><text x="38" y="625" class="small muted">threshold 0.32 · TP/FN/FP/TN 분해</text><text x="38" y="695" class="label teal">04 / 결과와 검증</text><rect x="38" y="740" width="644" height="150" rx="18" class="rose"/><text x="65" y="820" class="h1 dark">92.59%</text><text x="350" y="820" class="small ink">Recall · 개인 XGBoost 실험</text><text x="38" y="945" class="label teal">05 / 한계·다음 개선</text><text x="38" y="990" class="small muted">split 전 대치·중복 행·test 관여를 제거한 독립 holdout 필요</text></g>
  <!-- 주차장 상세 -->
  <g id="detail-parking" transform="translate(830 1250)"><rect width="720" height="1120" rx="28" class="bg"/><text x="38" y="48" class="label moss">01 · DATA COLLECTION</text><text x="38" y="125" class="h1 dark">주차장 검색</text><text x="38" y="175" class="body muted">주소 기반 리뷰 수집·수급 분석</text><line x1="38" y1="215" x2="682" y2="215" stroke="#839958"/><text x="38" y="265" class="label teal">01 / 해결할 문제</text><text x="38" y="310" class="body ink">이름만으로 수집하면 동명이인 장소의</text><text x="38" y="340" class="body ink">리뷰가 섞일 수 있었습니다.</text><rect x="38" y="390" width="644" height="90" rx="18" class="teal"/><text x="65" y="430" class="label white">02 / 구현 흐름</text><text x="65" y="462" class="small white">공공데이터 → 네이버 검색 → 주소 정규화 → DB/SQL</text><text x="38" y="535" class="label teal">03 / 선택의 이유</text><text x="38" y="585" class="h2 dark">데이터가 지원하는 범위로 조정</text><text x="38" y="625" class="small muted">34개 항목 검토 · 실시간 점유 데이터 0개</text><text x="38" y="695" class="h2 dark">주소가 맞을 때만 리뷰 연결</text><text x="38" y="735" class="small muted">도로명·지번·번지수 대조 · 실패 대상 기록</text><text x="38" y="805" class="label teal">04 / 결과와 검증</text><text x="38" y="875" class="h1 teal">34개</text><text x="230" y="875" class="small muted">공공 항목 검토</text><text x="38" y="985" class="label rose">05 / 한계·다음 개선</text><text x="38" y="1030" class="small muted">주소 매칭 평가셋과 precision·누락률을 추가 측정</text></g>
</svg>
